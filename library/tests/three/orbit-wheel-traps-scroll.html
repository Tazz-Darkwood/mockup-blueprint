<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>With OrbitControls, the mouse wheel over the canvas zooms and the page stops scrolling</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>
<div id="top"></div><div style="height:3000px">A long page below the canvas.</div>
<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(400, 300); $('#top').appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 100); camera.position.z = 5;
  const controls = new OrbitControls(camera, renderer.domElement);
  await real('wheel', '200,150,300');
  controls.update();
  const zoomOn = { pageScrolled: Math.round(scrollY), cameraDistance: +camera.position.length().toFixed(2) };
  controls.enableZoom = false;
  await real('wheel', '200,150,300');
  controls.update();
  const zoomOff = { pageScrolled: Math.round(scrollY), cameraDistance: +camera.position.length().toFixed(2) };
  return { pass: zoomOn.pageScrolled === 0 && zoomOn.cameraDistance !== 5 && zoomOff.pageScrolled > 100 && zoomOff.cameraDistance === zoomOn.cameraDistance,
           detail: 'wheel turned 300 with the pointer over the canvas. Zoom on (the default): ' + JSON.stringify(zoomOn) + '. With controls.enableZoom = false: ' + JSON.stringify(zoomOff) };
});
</script>
</body>
</html>
