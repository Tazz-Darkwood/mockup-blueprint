<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The picture is drawn at one pixel per CSS pixel until told otherwise</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer();
  const start = renderer.getPixelRatio();
  renderer.setPixelRatio(2);
  renderer.setSize(300, 200);
  const c = renderer.domElement;
  return { pass: start === 1 && c.width === 600 && c.height === 400 && c.style.width === '300px',
           detail: 'pixel ratio to begin with: ' + start + " (this screen's is " + devicePixelRatio + '). After setPixelRatio(2) and setSize(300, 200) the canvas draws ' + c.width + 'x' + c.height + ' and is shown at ' + c.style.width };
});
</script>
</body>
</html>
