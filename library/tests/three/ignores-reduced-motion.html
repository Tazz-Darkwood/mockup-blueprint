<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>three.js never checks whether the visitor asked for less motion</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

const asked = [];
const realMatchMedia = window.matchMedia.bind(window);
window.matchMedia = (query) => { asked.push(query); return realMatchMedia(query); };
run(async () => {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(200, 150); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 10); camera.position.z = 3;
  const controls = new OrbitControls(camera, renderer.domElement); controls.autoRotate = true;
  let drawn = 0; const start = camera.position.x;
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); drawn++; });
  await sleep(500);
  renderer.setAnimationLoop(null);
  const motionQueries = asked.filter((q) => /reduced-motion/.test(q));
  return { pass: drawn > 5 && motionQueries.length === 0 && camera.position.x !== start,
           detail: 'frames drawn with autoRotate on: ' + drawn + '; the camera moved: ' + (camera.position.x !== start) + '; times three.js or OrbitControls asked about prefers-reduced-motion: ' + motionQueries.length + ' (all media queries asked: ' + JSON.stringify(asked) + ')' };
});
</script>
</body>
</html>
