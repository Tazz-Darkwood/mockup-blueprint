<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The canvas starts at 300 by 150 and setSize pins its size in pixels</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const a = new THREE.WebGLRenderer();
  const start = a.domElement.width + 'x' + a.domElement.height;
  a.setSize(400, 300);
  const pinned = a.domElement.style.width + ' by ' + a.domElement.style.height;
  const b = new THREE.WebGLRenderer();
  b.setSize(400, 300, false);
  const free = JSON.stringify(b.domElement.style.width);
  return { pass: start === '300x150' && pinned === '400px by 300px' && free === '""' && b.domElement.width === 400 && a.domElement.style.display === 'block',
           detail: 'new canvas: ' + start + '. After setSize(400, 300) its style is ' + pinned + '. After setSize(400, 300, false) its style width is ' + free + ' and it still draws ' + b.domElement.width + ' wide. three sets display: ' + a.domElement.style.display };
});
</script>
</body>
</html>
