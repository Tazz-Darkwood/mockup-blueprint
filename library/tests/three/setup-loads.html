<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An import map and one module script are enough to draw</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(300, 200);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 300 / 200, 0.1, 10);
  camera.position.z = 3;
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial({ color: 0xff0000 })));
  renderer.render(scene, camera);
  const middle = pixel(renderer, 150, 100), corner = pixel(renderer, 5, 5);
  return { pass: middle[0] === 255 && middle[1] === 0 && corner[0] === 0,
           detail: 'three r' + THREE.REVISION + ', page opened as ' + location.protocol + ' the middle of the picture is ' + JSON.stringify(middle) + ' (the red box), the corner is ' + JSON.stringify(corner) };
});
</script>
</body>
</html>
