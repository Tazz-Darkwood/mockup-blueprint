<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opened from a folder, a page can load scripts and pictures beside it but cannot fetch them</title>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 16px/1.4 sans-serif; } </style>
</head>
<body>
<img id="pic" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<script>
run(async () => {
  const outcome = (p) => Promise.race([p.then(() => 'works', () => 'refused'), sleep(5000).then(() => 'no answer')]);
  const got = {};
  got.fetch = await outcome(fetch('beside.txt').then((r) => r.text()));
  got.xmlHttpRequest = await outcome(new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('GET', 'beside.txt'); x.onload = ok; x.onerror = no; x.send(); }));
  got.scriptTag = await outcome(new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'beside.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }));
  got.moduleImport = await outcome(import('./beside.js'));
  const fromFolder = location.protocol === 'file:';
  return { pass: fromFolder ? got.fetch === 'refused' && got.xmlHttpRequest === 'refused' && got.scriptTag === 'works' && got.moduleImport === 'refused' : got.fetch === 'works',
           detail: 'page opened as ' + location.protocol + ' ' + JSON.stringify(got) };
});
</script>
</body>
</html>
