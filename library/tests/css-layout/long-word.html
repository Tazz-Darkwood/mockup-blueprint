<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A long unbroken word or address sticks out of a narrow box</title>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 16px/1.4 sans-serif; } .box { width: 200px; margin: 0 0 8px; overflow: auto; }</style>
</head>
<body>
<p class="box" id="a">Write to https://www.example.org/averyveryverylongaddresswithnoplacetobreakitatall today</p>
<p class="box" id="b" style="overflow-wrap:anywhere">Write to https://www.example.org/averyveryverylongaddresswithnoplacetobreakitatall today</p>
<script>
run(async () => {
  const spill = (el) => el.scrollWidth - el.clientWidth;
  const got = { asMade: spill($('#a')), withOverflowWrapAnywhere: spill($('#b')) };
  return { pass: got.asMade > 50 && got.withOverflowWrapAnywhere === 0, detail: 'a long web address in a 200-pixel box. Pixels sticking out: ' + JSON.stringify(got) };
});
</script>
</body>
</html>
