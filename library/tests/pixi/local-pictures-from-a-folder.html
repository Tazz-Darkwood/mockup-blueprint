<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opened from a folder, a picture file beside the page cannot become a texture</title>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="../harness.js"></script>
<script src="common.js"></script>
<style>body { margin: 0; font: 15px sans-serif; }</style>
</head>
<body>

<script>
run(async () => {
  const app = await stage();
  const seen = {};
  try { const t = await PIXI.Assets.load('local.png'); seen.assetsLoad = 'loaded, ' + t.width + ' wide'; } catch (e) { seen.assetsLoad = 'FAILED'; }
  const img = new Image(); img.src = 'local.png';
  await new Promise((done) => { img.onload = done; img.onerror = done; });
  seen.imgTag = img.naturalWidth ? 'loaded, ' + img.naturalWidth + ' wide' : 'FAILED';
  try {
    const sprite = new PIXI.Sprite(PIXI.Texture.from(img));
    app.stage.addChild(sprite); app.render();
    seen.imgAsTexture = glPixel(app, 5, 5)[0] === 255 ? 'drawn' : 'not drawn';
    app.stage.removeChild(sprite);
  } catch (e) { seen.imgAsTexture = 'FAILED: ' + String(e.message).slice(0, 90); }
  try { const t = await PIXI.Assets.load(GREY); const sprite = new PIXI.Sprite(t); app.stage.addChild(sprite); app.render(); seen.dataAddress = glPixel(app, 5, 5)[0] === 255 ? 'drawn' : 'not drawn'; } catch (e) { seen.dataAddress = 'FAILED'; }
  const fromFolder = location.protocol === 'file:';
  return { pass: fromFolder ? seen.assetsLoad === 'FAILED' && seen.imgTag.startsWith('loaded') && seen.imgAsTexture !== 'drawn' && seen.dataAddress === 'drawn' : seen.dataAddress === 'drawn',
           detail: 'page opened as ' + location.protocol + ' ' + JSON.stringify(seen) };
});
</script>
</body>
</html>
