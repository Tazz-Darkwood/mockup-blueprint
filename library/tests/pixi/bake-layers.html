<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Several tinted layers can be baked into one texture that draws the same</title>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="../harness.js"></script>
<script src="common.js"></script>
<style>body { margin: 0; font: 15px sans-serif; }</style>
</head>
<body>

<script>
run(async () => {
  const app = await stage();
  const picture = await PIXI.Assets.load(GREY);
  const layers = new PIXI.Container();
  [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff].forEach((tint, i) => { const layer = new PIXI.Sprite(picture); layer.tint = tint; layer.alpha = 0.5; layer.x = i * 4; layers.addChild(layer); });
  app.stage.addChild(layers);
  app.render();
  const asLayers = glPixel(app, 30, 30);
  const baked = app.renderer.generateTexture(layers);
  app.stage.removeChild(layers);
  const one = new PIXI.Sprite(baked);
  app.stage.addChild(one);
  app.render();
  const asOne = glPixel(app, 30, 30);
  const close = asLayers.every((v, i) => Math.abs(v - asOne[i]) <= 2);
  return { pass: close && app.stage.children.length === 1 && baked.width === 80,
           detail: 'five half-clear tinted layers drew pixel ' + JSON.stringify(asLayers) + '. Baked with renderer.generateTexture into one texture ' + baked.width + ' by ' + baked.height + ' and shown as a single sprite, the same spot drew ' + JSON.stringify(asOne) };
});
</script>
</body>
</html>
