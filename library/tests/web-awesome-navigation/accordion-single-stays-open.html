<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>With mode=single, opening one item closes the other, and the open one cannot be closed</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-accordion mode="single"><wa-accordion-item id="a" label="First" expanded>Body one</wa-accordion-item><wa-accordion-item id="b" label="Second">Body two</wa-accordion-item></wa-accordion>
<script type="module">
run(async () => {
  await defined('wa-accordion', 'wa-accordion-item');
  await real('click', '#b'); await sleep(700); const swapped = !$('#a').expanded && $('#b').expanded;
  await real('click', '#b'); await sleep(700);
  return { pass: swapped && $('#b').expanded, detail: 'opening the second closed the first: ' + swapped + '; clicking the open item again left it open: ' + $('#b').expanded };
});
</script>
</body>
</html>
