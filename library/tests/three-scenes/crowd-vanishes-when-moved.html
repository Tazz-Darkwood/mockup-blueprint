<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A crowd that moves away from where it started can vanish</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(200, 200); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000); camera.position.set(0, 0, 10);
  const crowd = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }), 3), spot = new THREE.Matrix4();
  for (let i = 0; i < 3; i++) crowd.setMatrixAt(i, spot.setPosition(i - 1, 0, 0));
  scene.add(crowd); renderer.render(scene, camera);
  const got = { atStart: litPixels(renderer) > 0 };
  // everything walks 300 units to the right, and the camera goes with it
  for (let i = 0; i < 3; i++) crowd.setMatrixAt(i, spot.setPosition(300 + i - 1, 0, 0));
  crowd.instanceMatrix.needsUpdate = true;
  camera.position.x = 300; renderer.render(scene, camera);
  got.afterWalking = litPixels(renderer) > 0;
  crowd.computeBoundingSphere(); renderer.render(scene, camera);
  got.afterComputeBoundingSphere = litPixels(renderer) > 0;
  return { pass: got.atStart && !got.afterWalking && got.afterComputeBoundingSphere, detail: 'is the crowd drawn? ' + JSON.stringify(got) };
});
</script>
</body>
</html>
