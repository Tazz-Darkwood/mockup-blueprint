<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Something see-through in front can hide something see-through behind it</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(100, 100); document.body.appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100); camera.position.z = 10;
  const shot = (glassWritesDepth, glassOrder) => {
    const scene = new THREE.Scene();
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: 0x0000ff, transparent: true, opacity: 0.2, depthWrite: glassWritesDepth })); glass.position.z = 2;
    const mark = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.9 })); mark.position.z = 0;   // a see-through paint mark behind the glass
    glass.renderOrder = glassOrder;
    scene.add(glass, mark);        // glass first
    renderer.render(scene, camera);
    return pixel(renderer, 50, 50)[0];
  };
  const got = { sortedByDistance: shot(true, 0), glassForcedFirst: shot(true, -1), glassForcedFirstNoDepthWrite: shot(false, -1) };
  return { pass: got.sortedByDistance > 150 && got.glassForcedFirst < 20 && got.glassForcedFirstNoDepthWrite > 150,
           detail: 'red seen through blue glass (0 to 255): ' + JSON.stringify(got) };
});
</script>
</body>
</html>
