<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>From inside a shape nothing is drawn unless the material is told to show its inside</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(100, 100); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);   // the camera sits at the centre of a tunnel
  const path = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 5), new THREE.Vector3(0, 0, -5), new THREE.Vector3(2, 0, -15)]);
  const tunnel = new THREE.Mesh(new THREE.TubeGeometry(path, 40, 1, 12), new THREE.MeshBasicMaterial({ color: 0x8a5a2b }));
  scene.add(tunnel);
  const got = {};
  for (const side of ['FrontSide', 'BackSide', 'DoubleSide']) {
    tunnel.material.side = THREE[side]; tunnel.material.needsUpdate = true;
    renderer.render(scene, camera);
    got[side] = litPixels(renderer) > 5000;
  }
  return { pass: got.FrontSide === false && got.BackSide === true && got.DoubleSide === true, detail: 'camera inside a tube. Are the walls drawn? ' + JSON.stringify(got) + ' (FrontSide is the default)' };
});
</script>
</body>
</html>
