<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A tunnel can be shown growing by drawing only part of it</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(300, 100); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-11, 11, 3.7, -3.7, 0.1, 50); camera.position.z = 10;
  const path = new THREE.LineCurve3(new THREE.Vector3(-10, 0, 0), new THREE.Vector3(10, 0, 0));
  const geometry = new THREE.TubeGeometry(path, 20, 1, 8);
  scene.add(new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0xffffff })));
  renderer.render(scene, camera);
  const whole = { triangles: renderer.info.render.triangles, leftEnd: pixel(renderer, 30, 50)[0], rightEnd: pixel(renderer, 270, 50)[0] };
  geometry.setDrawRange(0, geometry.index.count / 2);   // the first half of its length
  renderer.render(scene, camera);
  const half = { triangles: renderer.info.render.triangles, leftEnd: pixel(renderer, 30, 50)[0], rightEnd: pixel(renderer, 270, 50)[0] };
  return { pass: whole.leftEnd === 255 && whole.rightEnd === 255 && half.leftEnd === 255 && half.rightEnd === 0 && half.triangles === whole.triangles / 2,
           detail: 'whole tube: ' + JSON.stringify(whole) + '. After setDrawRange to half: ' + JSON.stringify(half) };
});
</script>
</body>
</html>
