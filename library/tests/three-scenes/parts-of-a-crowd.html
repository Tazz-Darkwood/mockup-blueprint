<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A moving part on every member of a crowd needs a second crowd</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
const flat = (w, h) => { const c = new THREE.OrthographicCamera(-w / 100, w / 100, h / 100, -h / 100, 0.1, 50); c.position.z = 10; return c; };   // 50 pixels to a unit, looking from the front

run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(400, 200); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = flat(400, 200), white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const bodies = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), white, 2), arms = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), white, 2);
  scene.add(bodies, arms);
  const body = new THREE.Matrix4(), arm = new THREE.Matrix4(), turn = new THREE.Matrix4(), out = new THREE.Matrix4().makeTranslation(0.8, 0, 0);
  const pose = (angle) => { [-2, 2].forEach((x, i) => { body.makeTranslation(x, 0, 0); bodies.setMatrixAt(i, body); arm.copy(body).multiply(turn.makeRotationZ(angle)).multiply(out); arms.setMatrixAt(i, arm); }); bodies.instanceMatrix.needsUpdate = arms.instanceMatrix.needsUpdate = true; renderer.render(scene, camera); };
  pose(0);
  const before = { beside: pixel(renderer, 140, 100)[0], above: pixel(renderer, 100, 140)[0] };
  pose(Math.PI / 2);
  const after = { beside: pixel(renderer, 140, 100)[0], above: pixel(renderer, 100, 140)[0], calls: renderer.info.render.calls };
  return { pass: before.beside === 255 && before.above === 0 && after.beside === 0 && after.above === 255 && after.calls === 2,
           detail: 'two bodies, each with an arm in a second crowd placed by body x turn x reach. Arm beside the body: ' + JSON.stringify(before) + '. After turning each arm a quarter turn: ' + JSON.stringify(after) };
});
</script>
</body>
</html>
