<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lookAt points an object's front at the target, and a camera's view</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const target = new THREE.Vector3(10, 0, 0), round = (v) => v.toArray().map((n) => Math.round(n * 100) / 100);
  const ant = new THREE.Object3D(); ant.lookAt(target);
  const camera = new THREE.PerspectiveCamera(); camera.lookAt(target);
  const got = { objectPlusZ: round(new THREE.Vector3(0, 0, 1).applyQuaternion(ant.quaternion)), cameraMinusZ: round(new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)), cameraPlusZ: round(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion)) };
  // a child whose parent has moved: lookAt takes a position in the world, not relative to the parent
  const parent = new THREE.Group(); parent.position.set(0, 0, 50); const child = new THREE.Object3D(); parent.add(child); parent.updateMatrixWorld();
  child.lookAt(new THREE.Vector3(10, 0, 50));
  got.childOfMovedParent = round(new THREE.Vector3(0, 0, 1).applyQuaternion(child.quaternion));
  return { pass: got.objectPlusZ.join() === '1,0,0' && got.cameraMinusZ.join() === '1,0,0' && got.childOfMovedParent.join() === '1,0,0',
           detail: 'after lookAt at a point to the right (+x): ' + JSON.stringify(got) };
});
</script>
</body>
</html>
