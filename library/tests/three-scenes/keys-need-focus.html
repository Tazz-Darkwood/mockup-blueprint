<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A canvas hears no keys until it can take focus and has it</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(200, 100); document.body.appendChild(renderer.domElement);
  const canvas = renderer.domElement; let heard = 0;
  canvas.addEventListener('keydown', () => { heard++; });
  const r = canvas.getBoundingClientRect(), middle = (r.left + 100) + ',' + (r.top + 50);
  await real('mouse', middle); await real('press', 'ArrowLeft'); await sleep(50);
  const plain = heard;
  canvas.tabIndex = 0;
  await real('mouse', middle); await real('press', 'ArrowLeft'); await sleep(50);
  const focusable = heard - plain;
  let onWindow = 0; addEventListener('keydown', () => { onWindow++; });
  canvas.blur(); await real('press', 'ArrowLeft'); await sleep(50);
  return { pass: plain === 0 && focusable === 1 && onWindow === 1,
           detail: 'key presses heard by a listener on the canvas after clicking it: ' + plain + '. After giving it tabindex="0" and clicking it: ' + focusable + '. A listener on the window, with nothing focused: ' + onWindow };
});
</script>
</body>
</html>
