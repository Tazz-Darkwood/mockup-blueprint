<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A texture stretched past its edge smears unless it is told to repeat</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
const flat = (w, h) => { const c = new THREE.OrthographicCamera(-w / 100, w / 100, h / 100, -h / 100, 0.1, 50); c.position.z = 10; return c; };   // 50 pixels to a unit, looking from the front

run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(100, 400); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = flat(100, 400);
  const paint = document.createElement('canvas'); paint.width = 8; paint.height = 64; const ctx = paint.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 8, 32); ctx.fillStyle = '#000'; ctx.fillRect(0, 32, 8, 32);   // half white, half black
  const texture = new THREE.CanvasTexture(paint); texture.colorSpace = THREE.SRGBColorSpace;
  const strip = new THREE.PlaneGeometry(1, 8), uv = strip.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * 4);   // the picture is asked for four times along the strip
  scene.add(new THREE.Mesh(strip, new THREE.MeshBasicMaterial({ map: texture })));
  const bands = () => { renderer.render(scene, camera); return [0, 1, 2, 3, 4, 5, 6, 7].map((i) => (pixel(renderer, 50, 25 + i * 50)[0] > 128 ? 'w' : 'b')).join(''); };
  const got = { asMade: bands(), wrapSetting: texture.wrapT === THREE.ClampToEdgeWrapping ? 'clamp to edge' : 'other' };
  texture.wrapT = THREE.RepeatWrapping; texture.needsUpdate = true;
  got.toldToRepeat = bands();
  return { pass: got.wrapSetting === 'clamp to edge' && /^(bw|wb)(w{6}|b{6})$/.test(got.asMade) && /^(bw){4}$|^(wb){4}$/.test(got.toldToRepeat),
           detail: 'eight samples up a strip that asks for a black-and-white picture four times over. As made (' + got.wrapSetting + '): ' + got.asMade + '. With wrapT = RepeatWrapping: ' + got.toldToRepeat };
});
</script>
</body>
</html>
