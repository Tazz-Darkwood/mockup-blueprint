<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easing after a target must use the time passed, or the screen's speed changes it</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const fixed = (frames) => { let x = 0; for (let i = 0; i < frames; i++) x += (10 - x) * 0.05; return +x.toFixed(3); };                       // move a twentieth of the way each frame
  const timed = (frames) => { let x = 0; for (let i = 0; i < frames; i++) x = THREE.MathUtils.damp(x, 10, 3, 1 / frames); return +x.toFixed(3); };   // one second, in that many steps
  const got = { fixedAt60: fixed(60), fixedAt120: fixed(120), dampAt60: timed(60), dampAt120: timed(120), dampAt30: timed(30) };
  return { pass: Math.abs(got.fixedAt60 - got.fixedAt120) > 0.3 && Math.abs(got.dampAt60 - got.dampAt120) < 0.001 && Math.abs(got.dampAt60 - got.dampAt30) < 0.001,
           detail: 'how far towards 10 after one second. A fixed share each frame: ' + got.fixedAt60 + ' on a 60-a-second screen, ' + got.fixedAt120 + ' on a 120. MathUtils.damp with the time passed: ' + got.dampAt30 + ', ' + got.dampAt60 + ', ' + got.dampAt120 + ' at 30, 60 and 120' };
});
</script>
</body>
</html>
