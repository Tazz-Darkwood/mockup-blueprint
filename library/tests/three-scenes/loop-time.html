<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The loop is handed the time; a fixed step per frame ties speed to the screen</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../harness.js"></script>
<style>body { margin: 0; font: 15px sans-serif; } </style>
</head>
<body>

<script type="module">
// Colour of one pixel of what was just drawn, as [red, green, blue, alpha]. x and y count from the bottom left.
function pixel(renderer, x, y) {
  const gl = renderer.getContext(), p = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
// How many pixels of the picture are not the black background.
function litPixels(renderer) {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, all = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, all);
  let n = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 0) n++;
  return n;
}
const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });

import * as THREE from 'three';
run(async () => {
  const renderer = new THREE.WebGLRenderer(); renderer.setSize(100, 100); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera();
  const times = []; let perFrame = 0, perSecond = 0, last = null;
  const speed = 2;   // units a second
  renderer.setAnimationLoop((time) => {
    times.push(time);
    const dt = last === null ? 0 : Math.min((time - last) / 1000, 0.1); last = time;   // never step more than a tenth of a second, however long the tab was away
    perFrame += 0.03;          // a fixed step each frame
    perSecond += speed * dt;   // a step sized by the time that passed
    renderer.render(scene, camera);
  });
  await sleep(1000); renderer.setAnimationLoop(null);
  const span = (times[times.length - 1] - times[0]) / 1000, rising = times.every((t, i) => i === 0 || t > times[i - 1]);
  const got = { frames: times.length, seconds: +span.toFixed(2), movedByFixedStep: +perFrame.toFixed(2), movedByTime: +perSecond.toFixed(2), hasTimer: typeof THREE.Timer, hasClock: typeof THREE.Clock };
  return { pass: rising && typeof times[0] === 'number' && Math.abs(perSecond - speed * span) < 0.05 && Math.abs(perFrame - 0.03 * times.length) < 0.001,
           detail: JSON.stringify(got) + '. The fixed step moved 0.03 times the number of frames, so twice as far on a screen that refreshes twice as often. The timed step moved ' + speed + ' units a second whatever the screen' };
});
</script>
</body>
</html>
