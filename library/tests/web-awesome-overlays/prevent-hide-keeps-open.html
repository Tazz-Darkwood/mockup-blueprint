<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cancelling the wa-hide event keeps a dialog open</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-dialog id="d" label="Unsaved changes">Body</wa-dialog>
<script type="module">
run(async () => {
  await defined('wa-dialog');
  let source = null;
  $('#d').addEventListener('wa-hide', (e) => { source = e.detail && e.detail.source ? (e.detail.source.localName || String(e.detail.source)) : null; e.preventDefault(); });
  $('#d').open = true; await sleep(900); await real('press', 'Escape'); await sleep(800);
  return { pass: $('#d').open === true, detail: 'pressed Escape with wa-hide cancelled: still open ' + $('#d').open + '; the event said the close came from: ' + source };
});
</script>
</body>
</html>
