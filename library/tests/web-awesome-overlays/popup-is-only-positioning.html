<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wa-popup only positions content: it has no role and nothing dismisses it</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-popup id="off" placement="bottom"><wa-button slot="anchor">Anchor</wa-button><div id="offBody">Never shown</div></wa-popup>
<wa-popup id="on" placement="bottom" active><wa-button slot="anchor" id="anchor">Anchor</wa-button><div id="onBody">Floating content</div></wa-popup>
<script type="module">
run(async () => {
  await defined('wa-popup', 'wa-button');
  const shownOnlyWhenActive = !visible($('#offBody')) && visible($('#onBody'));
  const below = $('#onBody').getBoundingClientRect().top >= $('#anchor').getBoundingClientRect().bottom - 1;
  const aria = await real('aria', '#on');
  await real('press', 'Escape'); await sleep(300); await real('mouse', '900,650'); await sleep(300);
  return { pass: shownOnlyWhenActive && below && visible($('#onBody')) && !/dialog|menu|tooltip/.test(aria),
           detail: 'content shows only with the active attribute: ' + shownOnlyWhenActive + '; placed below its anchor: ' + below + '; still showing after Escape and a click elsewhere: ' + visible($('#onBody')) + '; announced as ' + JSON.stringify(aria) };
});
</script>
</body>
</html>
