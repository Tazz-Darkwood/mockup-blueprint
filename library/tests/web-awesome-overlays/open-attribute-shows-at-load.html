<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A dialog with the open attribute is shown as soon as the page loads</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-dialog id="d" label="Welcome" open>Shown straight away</wa-dialog>
<script type="module">
run(async () => {
  await defined('wa-dialog'); await sleep(600);
  const native = $('#d').shadowRoot.querySelector('dialog');
  return { pass: $('#d').open && native.open, detail: 'open attribute in the HTML: the dialog is showing: ' + native.open };
});
</script>
</body>
</html>
