<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A tooltip shows on hover and on keyboard focus of the element named in for</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-button id="a">Help</wa-button><wa-tooltip id="t" for="a">More about this</wa-tooltip><p id="away" style="margin-top:200px">Elsewhere</p>
<script type="module">
run(async () => {
  await defined('wa-tooltip', 'wa-button');
  await real('hover', '#a'); await sleep(900); const onHover = $('#t').open;
  await real('hover', '#away'); await sleep(700); const afterLeave = $('#t').open;
  $('#a').focus(); await sleep(800); const onFocus = $('#t').open;
  return { pass: onHover && !afterLeave && onFocus, detail: 'open on hover: ' + onHover + ', after moving away: ' + afterLeave + ', on keyboard focus: ' + onFocus };
});
</script>
</body>
</html>
