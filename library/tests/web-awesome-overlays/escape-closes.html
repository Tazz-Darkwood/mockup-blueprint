<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Escape key closes a dialog</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-dialog id="d" label="Confirm">Body</wa-dialog>
<script type="module">
run(async () => {
  await defined('wa-dialog');
  $('#d').open = true; await sleep(900); await real('press', 'Escape'); await sleep(900);
  return { pass: $('#d').open === false, detail: 'open after pressing Escape: ' + $('#d').open };
});
</script>
</body>
</html>
