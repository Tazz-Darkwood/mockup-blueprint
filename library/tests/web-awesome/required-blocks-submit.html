<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A required empty field blocks submit and fires wa-invalid</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f">
  <wa-input id="email" name="email" label="Email" required></wa-input>
  <wa-button id="submit" type="submit">Send</wa-button>
</form>
<script type="module">
run(async () => {
  await defined('wa-input', 'wa-button');
  const form = document.getElementById('f'), field = document.getElementById('email');
  let submits = 0; const fired = [];
  form.addEventListener('submit', (e) => { e.preventDefault(); submits++; });
  ['wa-invalid', 'invalid'].forEach((n) => field.addEventListener(n, () => fired.push(n)));
  const press = () => document.getElementById('submit').shadowRoot.querySelector('button').click();
  press(); await sleep(400);
  const blocked = submits === 0, validEmpty = form.checkValidity();
  field.value = 'a@b.co'; await field.updateComplete; press(); await sleep(400);
  return { pass: blocked && !validEmpty && fired.includes('wa-invalid') && submits === 1,
           detail: 'empty: submit blocked ' + blocked + ', events on the field ' + JSON.stringify([...new Set(fired)]) + '; after filling it in: submits ' + submits };
});
</script>
</body>
</html>
