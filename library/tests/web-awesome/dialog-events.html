<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opening and closing a dialog fires wa-show, wa-after-show, wa-hide, wa-after-hide</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-dialog id="d" label="Hello">Body text</wa-dialog>
<script type="module">
run(async () => {
  await defined('wa-dialog');
  const d = document.getElementById('d'); await d.updateComplete;
  const fired = [];
  ['wa-show', 'wa-after-show', 'wa-hide', 'wa-after-hide'].forEach((n) => d.addEventListener(n, () => fired.push(n)));
  d.open = true; await sleep(1500);
  const openNow = d.open;
  d.open = false; await sleep(1500);
  return { pass: ['wa-show', 'wa-after-show', 'wa-hide', 'wa-after-hide'].every((n) => fired.includes(n)),
           detail: 'set open=true then open=false; events in order: ' + JSON.stringify(fired) + ', was open: ' + openNow };
});
</script>
</body>
</html>
