<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A wa-button inside a form does not submit it unless type=submit</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f">
  <wa-button id="plain">No type attribute</wa-button>
  <wa-button id="submit" type="submit">type="submit"</wa-button>
</form>
<script type="module">
run(async () => {
  await defined('wa-button');
  let submits = 0;
  document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); submits++; });
  const press = (id) => document.getElementById(id).shadowRoot.querySelector('button').click();
  const type = document.getElementById('plain').type;
  press('plain'); await sleep(300); const afterPlain = submits;
  press('submit'); await sleep(300); const afterSubmit = submits;
  return { pass: type === 'button' && afterPlain === 0 && afterSubmit === 1,
           detail: 'default type is "' + type + '"; form submits after pressing the plain button: ' + afterPlain + ', after pressing the type=submit button: ' + afterSubmit };
});
</script>
</body>
</html>
