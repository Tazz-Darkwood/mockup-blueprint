<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A misspelled component tag never loads and shows no error on the page</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-button id="good">Good</wa-button>
<wa-buton id="typo">Typo</wa-buton>
<script type="module">
run(async () => {
  await defined('wa-button'); await sleep(1500);
  const never = [...document.querySelectorAll(':not(:defined)')].map((e) => e.localName);
  const typo = document.getElementById('typo');
  return { pass: never.length === 1 && never[0] === 'wa-buton' && !typo.shadowRoot && typo.textContent === 'Typo',
           detail: 'elements that never loaded: ' + JSON.stringify(never) + '; its text still shows as plain text: ' + (typo.getClientRects().length > 0) };
});
</script>
</body>
</html>
