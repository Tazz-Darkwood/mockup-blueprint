<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A required field is invalid from the start; user-invalid only after a failed submit</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f"><wa-input id="i" name="email" label="Email" required></wa-input><wa-button id="go" type="submit">Send</wa-button></form>
<script type="module">
run(async () => {
  await defined('wa-input', 'wa-button');
  $('#f').addEventListener('submit', (e) => e.preventDefault());
  const state = () => ({ invalid: $('#i').matches(':state(invalid)'), userInvalid: $('#i').matches(':state(user-invalid)') });
  const before = state();
  await real('click', '#go'); await sleep(400);
  const after = state();
  return { pass: before.invalid && !before.userInvalid && after.userInvalid,
           detail: 'on load: ' + JSON.stringify(before) + '; after pressing submit while empty: ' + JSON.stringify(after) };
});
</script>
</body>
</html>
