<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A colour picker is a button that opens a panel; the panel's text box has no name</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-color-picker id="c" label="Brand colour" value="#ff0000"></wa-color-picker>
<script type="module">
run(async () => {
  await defined('wa-color-picker');
  const closed = await real('aria', '#c');
  const r = $('#c').shadowRoot.querySelector('[part~=trigger]').getBoundingClientRect();
  await real('mouse', (r.left + r.width / 2) + ',' + (r.top + r.height / 2)); await sleep(900);
  const opened = $('#c').open, panel = await real('aria', '#c');
  await real('press', 'Escape'); await sleep(700);
  return { pass: closed.includes('button "Brand colour"') && opened && panel.includes('slider "hue"') && /- textbox: /.test(panel) && !$('#c').open,
           detail: 'closed: ' + JSON.stringify(closed) + '; clicking it opened the panel: ' + opened + '; panel contents: ' + JSON.stringify(panel.split('\n').slice(2).map((l) => l.trim()).join(' | ')) + '; open after Escape: ' + $('#c').open };
});
</script>
</body>
</html>
