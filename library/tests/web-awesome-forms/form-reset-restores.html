<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resetting the form puts a field back to its value attribute</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f"><wa-input id="i" name="city" label="City" value="Leeds"></wa-input></form>
<script type="module">
run(async () => {
  await defined('wa-input');
  $('#i').value = 'York'; await $('#i').updateComplete; const changed = $('#i').value;
  $('#f').reset(); await sleep(300);
  return { pass: changed === 'York' && $('#i').value === 'Leeds', detail: 'changed to "' + changed + '", after form.reset(): "' + $('#i').value + '"' };
});
</script>
</body>
</html>
