<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A tag input sends one form entry per tag</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f"><wa-tag-input id="t" name="topic" label="Topics" value="ants,bees"></wa-tag-input></form>
<script type="module">
run(async () => {
  await defined('wa-tag-input'); await sleep(400);
  const sent = formEntries($('#f'));
  return { pass: sent.join() === 'topic=ants,topic=bees' && Array.isArray($('#t').value),
           detail: 'value="ants,bees": the value property is ' + JSON.stringify($('#t').value) + ' and the form sends ' + JSON.stringify(sent) };
});
</script>
</body>
</html>
