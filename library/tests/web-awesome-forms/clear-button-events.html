<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The clear button empties the field and fires wa-clear, input and change</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-input id="i" label="Search" with-clear value="ants"></wa-input>
<script type="module">
run(async () => {
  await defined('wa-input');
  const fired = []; ['wa-clear', 'input', 'change'].forEach((n) => $('#i').addEventListener(n, () => fired.push(n)));
  $('#i').shadowRoot.querySelector('[part~=clear-button]').click(); await sleep(300);
  return { pass: $('#i').value === '' && ['wa-clear', 'input', 'change'].every((n) => fired.includes(n)),
           detail: 'value after clearing: "' + $('#i').value + '", events: ' + JSON.stringify(fired) };
});
</script>
</body>
</html>
