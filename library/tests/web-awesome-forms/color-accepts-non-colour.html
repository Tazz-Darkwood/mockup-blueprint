<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A colour picker keeps and submits a value that is not a colour</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f"><wa-color-picker id="c" name="colour" label="Colour" value="not-a-colour"></wa-color-picker></form>
<script type="module">
run(async () => {
  await defined('wa-color-picker');
  return { pass: $('#c').value === 'not-a-colour' && formEntries($('#f')).join() === 'colour=not-a-colour',
           detail: 'value="not-a-colour": the picker holds "' + $('#c').value + '", reports itself valid: ' + $('#c').checkValidity() + ', and the form sends ' + JSON.stringify(formEntries($('#f'))) };
});
</script>
</body>
</html>
