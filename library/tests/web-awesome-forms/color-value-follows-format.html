<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A colour picker rewrites its value into the chosen format</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<form id="f"><wa-color-picker id="hex" name="hex" label="Hex" value="rebeccapurple"></wa-color-picker>
<wa-color-picker id="rgb" name="rgb" label="RGB" format="rgb" value="#ff0000"></wa-color-picker>
<wa-color-picker id="alpha" name="alpha" label="With opacity" opacity value="#ff000080"></wa-color-picker></form>
<script type="module">
run(async () => {
  await defined('wa-color-picker');
  const v = { hex: $('#hex').value, rgb: $('#rgb').value, alpha: $('#alpha').value };
  return { pass: v.hex === '#663399' && v.rgb === 'rgb(255, 0, 0)' && v.alpha === '#ff000080' && formEntries($('#f')).includes('rgb=rgb(255, 0, 0)'),
           detail: 'value="rebeccapurple" became "' + v.hex + '"; value="#ff0000" with format="rgb" became "' + v.rgb + '"; with opacity the value is "' + v.alpha + '"; the form sends ' + JSON.stringify(formEntries($('#f'))) };
});
</script>
</body>
</html>
