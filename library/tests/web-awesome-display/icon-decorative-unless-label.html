<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An icon is hidden from screen readers unless it has a label, so an icon-only button has no name</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-icon id="plain" name="gear"></wa-icon><wa-icon id="named" name="gear" label="Settings"></wa-icon>
<wa-button id="bare"><wa-icon name="gear"></wa-icon></wa-button><wa-button id="ok"><wa-icon name="gear" label="Settings"></wa-icon></wa-button>
<script type="module">
run(async () => {
  await defined('wa-icon', 'wa-button'); await sleep(800);
  const bare = (await real('aria', '#bare')).split('\n')[0], ok = (await real('aria', '#ok')).split('\n')[0];
  return { pass: $('#plain').getAttribute('aria-hidden') === 'true' && $('#named').getAttribute('role') === 'img' && bare.trim() === '- button' && ok.includes('button "Settings"'),
           detail: 'icon without label: aria-hidden=' + $('#plain').getAttribute('aria-hidden') + '; with label: role=' + $('#named').getAttribute('role') + '; icon-only button: ' + JSON.stringify(bare) + '; with a labelled icon: ' + JSON.stringify(ok) };
});
</script>
</body>
</html>
