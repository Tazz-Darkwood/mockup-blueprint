<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A button group is announced as a group named by its label; arrow keys do not move between its buttons</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-button-group id="g" label="Alignment"><wa-button id="a">Left</wa-button><wa-button id="b">Right</wa-button></wa-button-group>
<wa-button-group id="bare"><wa-button>One</wa-button><wa-button>Two</wa-button></wa-button-group>
<script type="module">
run(async () => {
  await defined('wa-button-group', 'wa-button');
  const named = await real('aria', '#g'), bare = await real('aria', '#bare');
  $('#a').focus(); await real('press', 'ArrowRight'); await sleep(200); const afterArrow = document.activeElement.id;
  await real('press', 'Tab'); await sleep(200);
  return { pass: named.startsWith('- group "Alignment"') && bare.startsWith('- group:') && afterArrow === 'a' && document.activeElement.id === 'b',
           detail: 'with label: ' + JSON.stringify(named.split('\n')[0]) + '; without: ' + JSON.stringify(bare.split('\n')[0]) + '; focus after right arrow: #' + afterArrow + ', after Tab: #' + document.activeElement.id };
});
</script>
</body>
</html>
