<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A zoomable frame is 16:9 tall by default</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-zoomable-frame id="z" srcdoc="<p>Hi</p>" label="Preview"></wa-zoomable-frame>
<script type="module">
run(async () => {
  await defined('wa-zoomable-frame'); await sleep(500);
  const r = $('#z').getBoundingClientRect();
  return { pass: Math.abs(r.width / r.height - 16 / 9) < 0.05, detail: 'one line of content: the frame is ' + Math.round(r.width) + ' by ' + Math.round(r.height) + ' pixels (ratio ' + (r.width / r.height).toFixed(2) + ')' };
});
</script>
</body>
</html>
