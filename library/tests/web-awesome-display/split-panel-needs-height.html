<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A split panel is only as tall as its content unless given a height</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-split-panel id="a"><div slot="start">Start</div><div slot="end">End</div></wa-split-panel>
<wa-split-panel id="b" style="height: 240px"><div slot="start">Start</div><div slot="end">End</div></wa-split-panel>
<script type="module">
run(async () => {
  await defined('wa-split-panel');
  const h = (id) => Math.round($(id).getBoundingClientRect().height);
  return { pass: h('#a') < 40 && h('#b') === 240, detail: 'no height set: ' + h('#a') + ' pixels tall; with style="height: 240px": ' + h('#b') };
});
</script>
</body>
</html>
