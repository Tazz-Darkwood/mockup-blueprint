<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wa-mutation-observer fires wa-mutation when its content changes</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-mutation-observer id="m" child-list><ul id="list"><li>One</li></ul></wa-mutation-observer>
<script type="module">
run(async () => {
  await defined('wa-mutation-observer');
  let detail = null; $('#m').addEventListener('wa-mutation', (e) => { detail = e.detail; });
  $('#list').append(document.createElement('li')); await sleep(300);
  return { pass: !!detail && Array.isArray(detail.mutationList) && detail.mutationList[0].type === 'childList',
           detail: 'added a list item: wa-mutation fired with ' + (detail ? detail.mutationList.length + ' record(s) of type ' + detail.mutationList[0].type : 'nothing') };
});
</script>
</body>
</html>
