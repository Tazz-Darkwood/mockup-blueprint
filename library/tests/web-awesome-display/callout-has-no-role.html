<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A callout is plain text to a screen reader: it is not announced as an alert</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-callout id="c" variant="danger">Payment failed</wa-callout>
<script type="module">
run(async () => {
  await defined('wa-callout');
  const aria = await real('aria', '#c');
  return { pass: !/alert|status/.test(aria) && $('#c').getAttribute('role') === null, detail: 'variant="danger": role attribute is ' + $('#c').getAttribute('role') + '; announced as ' + JSON.stringify(aria) };
});
</script>
</body>
</html>
