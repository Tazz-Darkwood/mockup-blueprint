<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An avatar whose image fails shows its initials, and needs a label to have a name</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-avatar id="a" image="https://ka-f.webawesome.com/no-such-picture.png" initials="AB" label="Ada Byron"></wa-avatar><wa-avatar id="b" initials="CD"></wa-avatar>
<script type="module">
run(async () => {
  await defined('wa-avatar'); await sleep(1500);
  const a = await real('aria', '#a'), b = await real('aria', '#b');
  return { pass: a.includes('img "Ada Byron"') && a.includes('AB') && b.trim() === '- img: CD', detail: 'broken image with label: ' + JSON.stringify(a) + '; no label: ' + JSON.stringify(b) };
});
</script>
</body>
</html>
