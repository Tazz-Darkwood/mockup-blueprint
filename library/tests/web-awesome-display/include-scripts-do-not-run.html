<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scripts inside included content do not run unless allow-scripts is set</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-include id="i" src="data:text/html,<p id='inc'>Included text</p><script>window.includedRan = true</script>"></wa-include>
<script type="module">
run(async () => {
  await defined('wa-include'); await sleep(1200);
  return { pass: !!document.getElementById('inc') && window.includedRan !== true, detail: 'the included paragraph is on the page: ' + !!document.getElementById('inc') + '; its script ran: ' + (window.includedRan === true) };
});
</script>
</body>
</html>
