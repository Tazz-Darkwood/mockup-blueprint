<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A progress ring is named Progress unless given a label</title>
<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
<script src="../harness.js"></script>
</head>
<body>
<wa-progress-ring id="bare" value="40"></wa-progress-ring><wa-progress-ring id="named" value="40" label="Upload">40%</wa-progress-ring>
<script type="module">
run(async () => {
  await defined('wa-progress-ring');
  const bare = await real('aria', '#bare'), named = await real('aria', '#named'), r = $('#bare').getBoundingClientRect();
  return { pass: bare.includes('progressbar "Progress"') && named.includes('progressbar "Upload"') && named.includes('40%') && Math.round(r.width) === 128,
           detail: 'no label: ' + JSON.stringify(bare.split('\n')[0]) + '; with label and text inside: ' + JSON.stringify(named.replace(/\n\s*/g, ' ')) + '; default size ' + Math.round(r.width) + ' pixels' };
});
</script>
</body>
</html>
