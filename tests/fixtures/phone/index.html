<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone fixture</title>
<style>
body { margin: 0; padding: 1rem 1rem 90px; font: 16px/1.5 sans-serif; }
.wide { width: 900px; background: #eee; }
button.small { width: 18px; height: 18px; padding: 0; border: 1px solid #333; background: #fff; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; background: #222; color: #fff; }
</style>
</head>
<body>
<main>
<h1>Phone fixture</h1>
<div class="wide">A block wider than a phone screen.</div>
<p><button class="small" type="button" aria-label="Small control"></button></p>
<details><summary>Closed fold-out</summary><label><input type="radio" name="a"> A hidden option</label></details>
<p>The last words on the page.</p>
</main>
<div class="bar">A bar fixed to the bottom</div>
</body>
</html>
