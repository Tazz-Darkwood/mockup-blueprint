<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text over pictures</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 18px/1.5 sans-serif; background: #fff; }
  section { padding: 40px; }
  .faint { background: linear-gradient(90deg, #7a7a7a, #8a8a8a); color: #666; }
  .fine { background: linear-gradient(90deg, #fff, #eee); color: #111; }
  .sheet { position: relative; isolation: isolate; background-color: #ddd; color: #555; }
  .sheet::before { content: ""; position: absolute; inset: 0; z-index: 0; mix-blend-mode: multiply;
                   background-image: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .45)); }
  .sheet p { position: relative; z-index: 1; }
  .spacer { height: 1400px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; color: #777; }
  .bar { background: linear-gradient(90deg, #f4ecdc, #efe6d4); color: #1f2a22; padding: 20px; }
  .count { display: inline-block; min-width: 1.6em; padding: 2px 6px; border-radius: 999px; background: #2e4f37; color: #fff; }
  .stamp { display: inline-block; padding: 2px 10px; border: 3px solid #1e3f8f; border-radius: 6px; color: #1e3f8f; font-weight: 700; }
</style>
</head>
<body>
<main>
<section class="faint"><p>Grey words on a grey gradient.</p><span class="sr-only">Only for screen readers.</span></section>
<section class="fine"><p>Dark words on a pale gradient.</p></section>
<section class="bar"><a href="#">Basket <span class="count">2</span></a> <span class="stamp">FULL</span></section>
<div class="spacer"></div>
<section class="sheet"><p>Words on a sheet that a stain darkens.</p></section>
</main>
</body>
</html>
