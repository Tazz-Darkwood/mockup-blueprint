<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast in oklch</title>
<style>
body { margin: 2rem; background: oklch(0.98 0.01 90); color: oklch(0.25 0.01 90); font: 18px/1.5 sans-serif; }
.faint { color: oklch(0.8 0.02 90); }
.sheet { background: oklch(0.3 0.02 260); color: oklch(0.95 0.01 90); padding: 1rem; }
</style>
</head>
<body>
<main>
<h1>Colours written in oklch</h1>
<p>Dark words on a pale page.</p>
<p class="faint">Faint words on a pale page.</p>
<p class="sheet">Pale words on a dark sheet.</p>
</main>
</body>
</html>
